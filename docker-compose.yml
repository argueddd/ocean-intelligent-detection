services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./wireless-network-npt.htpasswd:/etc/nginx/conf.d/wireless-network-npt.htpasswd:ro
      - /ssl:/etc/nginx/ssl:ro
      - /intelligent-cockpit/:/intelligent-cockpit
    networks:
      - proxy-tier

networks:
  proxy-tier:
    external: true
