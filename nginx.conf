server {
    listen 80;
    server_name agent-show.com www.agent-show.com;

    # HTTP 自动跳转 HTTPS (强制跳转到 www 以匹配证书)
    location / {
        return 301 https://www.agent-show.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.agent-show.com;
    client_max_body_size 100M;

    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/www.agent-show.com.pem;
    ssl_certificate_key /etc/nginx/ssl/www.agent-show.com.key;

    # SSL 优化配置
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # 安全响应头：强制 HTTPS 和 升级不安全请求
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;

    # BEGIN wireless-network-npt
    # wireless-network-npt big-screen frontend
    location = /wireless-network-npt {
        return 301 /wireless-network-npt/;
    }

    location /wireless-network-npt/ {
        auth_basic "Wireless Network NPT";
        auth_basic_user_file /etc/nginx/conf.d/wireless-network-npt.htpasswd;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $wireless_npt_frontend http://wireless-network-npt-frontend:80;
        rewrite ^/wireless-network-npt/?(.*)$ /$1 break;
        proxy_pass $wireless_npt_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    }

    location /api/big-screen/ {
        auth_basic "Wireless Network NPT";
        auth_basic_user_file /etc/nginx/conf.d/wireless-network-npt.htpasswd;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $wireless_npt_frontend http://wireless-network-npt-frontend:80;
        proxy_pass $wireless_npt_frontend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # BEGIN wireless-network-npt-qa-api
    location = /api/sessions {
        auth_basic "Wireless Network NPT";
